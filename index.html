<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Hagon is building a clearer way to understand cybersecurity risk." />
  <meta name="theme-color" content="#f4f1ea" />
  <title>Hagon — Coming Soon</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --text: #171717;
      --muted: #6b6b66;
      --line: rgba(23, 23, 23, 0.18);
      --line-strong: rgba(23, 23, 23, 0.72);
      --panel: rgba(255, 255, 255, 0.36);
      --shadow: 0 20px 60px rgba(20, 20, 20, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 14%, rgba(255,255,255,0.9), transparent 28%),
        linear-gradient(180deg, #f7f4ed 0%, var(--bg) 100%);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 24px;
    }

    .topbar,
    .footer {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .topbar {
      padding: 8px 0 24px;
    }

    .brand {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      letter-spacing: -0.055em;
      font-size: clamp(1.6rem, 2vw, 2.2rem);
      font-weight: 600;
      line-height: 1;
    }

    .brand::after {
      content: "";
      width: 1px;
      height: 34px;
      background: var(--line-strong);
      display: block;
    }

    .brand-ghost {
      position: absolute;
      left: 0;
      top: 1.15em;
      opacity: 0.035;
      transform: scaleX(-1);
      transform-origin: center;
      font-size: 0.88em;
      letter-spacing: -0.055em;
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
    }

    .status {
      color: var(--muted);
      font-size: 0.86rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero-wrap {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 7vh 0 10vh;
    }

    .hero {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      align-items: end;
      gap: clamp(44px, 8vw, 120px);
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(4.3rem, 11vw, 10.5rem);
      font-weight: 540;
      line-height: 0.84;
      letter-spacing: -0.075em;
    }

    h1 span {
      display: block;
    }

    .intro-card {
      border-left: 1px solid var(--line-strong);
      padding: 4px 0 4px 28px;
    }

    .intro-card p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      line-height: 1.65;
    }

    .intro-card strong {
      color: var(--text);
      font-weight: 560;
    }

    .signal {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 0.92rem;
    }

    .signal-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 0 6px rgba(23, 23, 23, 0.06);
    }

    .footer {
      border-top: 1px solid var(--line);
      padding: 22px 0 4px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover,
    .footer a:focus-visible {
      color: var(--text);
    }

    @media (max-width: 820px) {
      .page {
        padding: 18px;
      }

      .topbar {
        align-items: flex-start;
      }

      .hero-wrap {
        padding: 9vh 0 12vh;
      }

      .hero {
        grid-template-columns: 1fr;
        align-items: start;
        gap: 56px;
      }

      h1 {
        font-size: clamp(4.5rem, 21vw, 8rem);
      }

      .intro-card {
        max-width: 520px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero,
      .topbar,
      .footer {
        animation: reveal 700ms ease-out both;
      }

      .hero {
        animation-delay: 80ms;
      }

      .footer {
        animation-delay: 150ms;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Hagon home">
        <span>hagon</span>
        <span class="brand-ghost" aria-hidden="true">hagon</span>
      </a>
      <div class="status">Launching soon</div>
    </header>

    <main class="hero-wrap">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Cybersecurity, made clear</p>
          <h1 id="page-title">
            <span>Know</span>
            <span>what</span>
            <span>matters.</span>
          </h1>
        </div>

        <div class="intro-card">
          <p>
            <strong>Hagon</strong> is building a clearer way to understand
            cybersecurity risk, see what is driving it, and know where to act first.
          </p>
          <div class="signal" aria-label="Hagon is currently in development">
            <span class="signal-dot" aria-hidden="true"></span>
            In development
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>© 2026 Hagon Technologies LLC</span>
      <a href="mailto:hello@hagontech.com">hello@hagontech.com</a>
    </footer>
  </div>
</body>
</html>
